name: Apply mobile touch improvements

on:
  push:
    paths:
      - .github/mobile-touch-improvements.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve mobile buttons and layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '    /* ─── RESPONSIVE ─── */'
          if 'MOBILE-FIRST TOUCH IMPROVEMENTS' not in html:
              css = r'''
    /* ─── MOBILE-FIRST TOUCH IMPROVEMENTS ─── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 16px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .card-title .icon {
      flex-shrink: 0;
      font-size: 1.3rem;
    }

    .tab-btn,
    .social-tab-btn,
    .link-btn,
    .chip,
    .vip-atendimento .vip-link,
    .group-cta a,
    .whatsapp-float {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .link-btn,
    .chip {
      position: relative;
      min-height: 48px;
      box-shadow: 0 3px 10px rgba(17,17,17,0.06);
    }

    .link-btn {
      background: var(--white);
      border-color: #d7d7dc;
    }

    .link-btn .lb-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 800;
      flex-shrink: 0;
    }

    .chip {
      justify-content: space-between;
      border-color: transparent;
      padding: 11px 14px;
      line-height: 1.35;
      white-space: normal;
    }

    .chip::after {
      content: "↗";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      font-size: 0.9rem;
      font-weight: 800;
      background: rgba(255,255,255,0.85);
      flex-shrink: 0;
    }

    .chip-insta {
      background: #fdf2f8;
      color: #86198f;
      border-color: #f0abfc;
    }

    .chip-whats {
      background: #f0fdf4;
      color: #15803d;
      border-color: #86efac;
    }

    .chip-telegram {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #93c5fd;
    }

    .chip:active,
    .link-btn:active,
    .social-tab-btn:active,
    .tab-btn:active {
      transform: scale(0.98);
    }

'''
              html = html.replace(marker, css + marker, 1)

          old_mobile = '''    @media (max-width: 600px) {
      header { padding: 28px 16px 24px; }
      .card { padding: 18px 16px; }
      .alert { margin: 16px; }
      .alert-confirmed { font-size: 1.2rem; }
      .whatsapp-float { font-size: 0.82rem; padding: 10px 16px 10px 12px; bottom: 16px; right: 16px; }
    }'''
          new_mobile = '''    @media (max-width: 600px) {
      header { padding: 28px 16px 24px; }
      .header-logo { max-width: 210px; margin-bottom: 16px; }
      .tabs-wrapper { padding: 0 12px 32px; }
      .card { padding: 18px 14px; border-radius: 10px; }
      .alert { margin: 14px 0; padding: 16px 14px; }
      .alert-confirmed { font-size: 1.05rem; line-height: 1.35; }
      .vip-atendimento { margin: 16px 0; padding: 20px 16px; }
      .vip-atendimento .vip-title { font-size: 1.08rem; line-height: 1.35; align-items: flex-start; }
      .vip-atendimento .vip-link,
      .group-cta a { width: 100%; justify-content: center; border-radius: 12px; }
      .tab-nav { gap: 8px; margin-left: -12px; margin-right: -12px; padding: 0 12px 8px; }
      .tab-btn { padding: 10px 16px; min-height: 44px; box-shadow: 0 2px 8px rgba(17,17,17,0.06); }
      .social-wrapper { padding: 0 12px; }
      .social-header h2 { font-size: 1rem; line-height: 1.35; }
      .social-header p { font-size: 0.88rem; line-height: 1.5; }
      .social-tabs { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 14px; gap: 5px; }
      .social-tab-btn { justify-content: center; padding: 10px 6px; border-radius: 10px; font-size: 0.78rem; }
      .chips-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
      .chip { width: 100%; font-size: 0.92rem; }
      .link-btn { align-items: flex-start; padding: 14px; gap: 10px; }
      .link-btn .lb-meta { min-width: 0; flex: 1; line-height: 1.35; }
      .tag { align-self: center; }
      .step { gap: 10px; }
      .acc-header { padding: 15px 14px; line-height: 1.35; }
      .acc-body { padding: 14px; }
      .closing-msg { margin: 0 12px 24px; padding: 20px 16px; }
      .whatsapp-float { left: 12px; right: 12px; bottom: 12px; max-width: none; justify-content: center; font-size: 0.84rem; padding: 12px 14px; border-radius: 14px; }
      footer { padding-bottom: 90px; }
    }'''
          if old_mobile in html:
              html = html.replace(old_mobile, new_mobile, 1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
          else
            git commit -m "Improve mobile touch layout"
            git push
          fi
