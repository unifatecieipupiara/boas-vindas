name: Mobile touch improvements

on:
  push:
    paths:
      - '.github/mobile-touch-improvements.trigger'
      - '.github/scripts/apply_mobile_touch_improvements.py'
      - '.github/workflows/apply-mobile-touch-improvements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Improve mobile buttons and layout
        run: python .github/scripts/apply_mobile_touch_improvements.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
          else
            git commit -m "Improve mobile touch layout"
            git push
          fi
